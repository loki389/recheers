<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img src="logo.jpg" alt="Logo">
        <div><h1>酒别重逢</h1><span>配方交流 / 风味反馈 / 非遗共创</span></div>
      </a>
      <div class="nav-actions">
        <a class="nav-link" href="index.html">返回首页</a>
        <span class="user-chip" id="userChip"></span>
        <button class="primary-btn" type="button" onclick="document.getElementById('postForm').scrollIntoView({behavior:'smooth'})">+ 分享配方</button>
        <button class="outline-btn" id="loginBtn" type="button">登录 / 注册</button>
        <button class="outline-btn hidden" id="logoutBtn" type="button">退出</button>
      </div>
    </div>
  </nav>

  <main class="community-main">
    <section class="hero container">
      <div class="hero-grid">
        <div>
          <h2>用户互动社区</h2>
          <p>把用户交流从首页拆出来，单独承载配方分享、调酒反馈、材料替代和项目调研后的持续运营内容。</p>
        </div>
        <div class="community-stats">
          <div class="stat"><strong id="postCount">0</strong><span>社区内容</span></div>
          <div class="stat"><strong>3</strong><span>互动方向：配方 / 工具 / 口味</span></div>
        </div>
      </div>
      <div class="tabs" role="tablist" aria-label="社区内容分类">
        <button type="button">关注</button>
        <button class="active" type="button">推荐</button>
        <button type="button">最新</button>
        <button type="button">精华</button>
        <button type="button">问答</button>
      </div>
      <div class="topic-row" aria-label="热门话题">
        <button class="topic-chip active" type="button">热门</button>
        <button class="topic-chip" type="button">非遗传承</button>
        <button class="topic-chip" type="button">调酒技巧</button>
        <button class="topic-chip" type="button">风味灵感</button>
        <button class="topic-chip" type="button">材料替代</button>
      </div>
    </section>

    <section class="container layout">
      <form id="postForm" class="card compose-card">
        <div class="card-head">
          <p class="card-title">发布交流内容</p>
          <p class="card-sub">登录后可以分享你的自调酒配方、工具替代经验或口味反馈。</p>
        </div>
        <div class="card-body">
          <div id="postLocked" class="locked">当前未登录。请先登录或注册，再发布社区内容。</div>
          <div id="postFields" class="hidden">
            <div class="field"><label for="postTitle">标题</label><input id="postTitle" placeholder="例如：宿舍版金汤力替代方案"></div>
            <div class="field"><label for="postBody">内容</label><textarea id="postBody" placeholder="记录比例、口味、工具、材料替代或踩坑经验"></textarea></div>
            <div class="field"><label for="postTags">标签</label><input id="postTags" placeholder="用逗号分隔，例如：清爽,低酒精,无摇壶"></div>
            <button class="primary-btn" type="submit">发布</button>
          </div>
        </div>
      </form>
      <div class="post-list" id="postList"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="移动端底部导航">
    <a href="index.html"><b>⌂</b><span>首页</span></a>
    <a href="index.html#visualization"><b>◇</b><span>探索</span></a>
    <button type="button" onclick="document.getElementById('postForm').scrollIntoView({behavior:'smooth'})"><b>＋</b><span>发布</span></button>
    <button type="button"><b>□</b><span>消息</span></button>
    <button type="button" id="mobileLoginBtn"><b>○</b><span>我的</span></button>
  </nav>

  <div class="modal" id="loginModal" aria-hidden="true">
    <form class="modal-card" id="authForm">
      <h2>账号入口</h2>
      <p>使用账号和密码登录，或注册新账号参与社区发布。</p>
      <div class="auth-tabs">
        <button class="auth-tab active" type="button" data-auth-mode="login">登录</button>
        <button class="auth-tab" type="button" data-auth-mode="register">注册</button>
      </div>
      <div class="auth-panel" data-panel="login">
        <div class="field"><label for="loginName">账号</label><input id="loginName" placeholder="请输入账号"></div>
        <div class="field"><label for="loginPass">密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
      </div>
      <div class="auth-panel hidden" data-panel="register">
        <div class="field"><label for="registerName">账号</label><input id="registerName" placeholder="设置账号"></div>
        <div class="field"><label for="registerPass">密码</label><input id="registerPass" type="password" placeholder="设置密码"></div>
      </div>
      <div class="auth-note" id="authMessage"></div>
      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:20px">
        <button class="outline-btn" id="closeLogin" type="button">取消</button>
        <button class="primary-btn" id="authSubmit" type="submit">登录</button>
      </div>
    </form>
  </div>

      {
        author: "老酒铺掌柜Leo",
        title: "柚见东方",
        badge: "非遗传承人",
        bio: "传承三代 | 专注米酒与果酒",
        body: "复刻了你的配方，整体平衡感很好，如果柚子皮再处理得更薄一些，香气会更通透。",
        recipe: "柚子 · 米酒 · 茶汤 · 蜂蜜",
        heat: "5,187",
        copies: "646",
        likes: "318",
        replies: [
          ["梅子酱", "收到！下次会把白瓤去得更干净。", "44"]
        ],
        tags: ["柚子", "茶香", "米酒"],
        createdAt: new Date(Date.now() - 4 * 60 * 60 * 1000).toISOString()
      }
    ];
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(authToken ? { Authorization: `Bearer ${authToken}` } : {}),
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "请求失败");
      return data;
    }
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));}
    function openLogin(){ $("#loginModal").classList.add("show"); $("#loginModal").setAttribute("aria-hidden","false"); }
    function closeLogin(){ $("#loginModal").classList.remove("show"); $("#loginModal").setAttribute("aria-hidden","true"); }
    function setAuthMode(mode){authMode=mode;$$(".auth-tab").forEach(tab=>tab.classList.toggle("active",tab.dataset.authMode===mode));$$(".auth-panel").forEach(panel=>panel.classList.toggle("hidden",panel.dataset.panel!==mode));$("#authSubmit").textContent=mode==="register"?"注册":"登录";$("#authMessage").textContent="";}
    function setCurrentUser(user, token){currentUser=user;if(token){authToken=token;localStorage.setItem(TOKEN_KEY,token);}localStorage.setItem(USER_KEY,JSON.stringify(currentUser));closeLogin();updateAuthUI();}
    function updateAuthUI(){const loggedIn=Boolean(currentUser);$("#loginBtn").classList.toggle("hidden",loggedIn);$("#logoutBtn").classList.toggle("hidden",!loggedIn);$("#userChip").style.display=loggedIn?"inline-flex":"none";$("#userChip").textContent=loggedIn?`已登录：${currentUser.name}`:"";$("#postLocked").classList.toggle("hidden",loggedIn);$("#postFields").classList.toggle("hidden",!loggedIn);}
    function relativeTime(iso){const diff=Math.max(1,Math.round((Date.now()-new Date(iso).getTime())/3600000));return diff<24?`${diff}小时前`:`${Math.round(diff/24)}天前`;}
    function renderPosts(){
      const all=posts.length?posts:seedPosts;
      $("#postCount").textContent=all.length;
      $("#postList").innerHTML=all.map((post,index)=>{
        const tags=(post.tags||[]).map(tag=>`<span class="tag">${escapeHtml(tag)}</span>`).join("");
        const replies=(post.replies||[]).map(([name,copy,likes])=>`<div class="reply"><img src="logo.jpg" alt=""><div><h4>${escapeHtml(name)} <span>作者</span></h4><p>${escapeHtml(copy)}</p></div><span class="like-pill">${escapeHtml(likes)}</span></div>`).join("");
        const recipe=post.recipe||((post.tags||[]).length?post.tags.join(" · "):"清爽 · 低度 · 易复刻");
        const heat=post.heat||"1,284";
        const copies=post.copies||"328";
        const likes=post.likes||"86";
        return `<article class="post-card"><div class="post-inner">
          <div class="post-author"><img src="logo.jpg" alt=""><div><h3>${escapeHtml(post.author||"匿名用户")} <span>${escapeHtml(post.badge||"创作者")}</span></h3><p>${escapeHtml(post.bio||"分享自调酒配方与复刻心得")}</p></div><time class="post-time">${relativeTime(post.createdAt||new Date().toISOString())}</time></div>
          <p class="post-copy">${escapeHtml(post.body||post.title)}</p>
          <div class="recipe-mini"><div class="recipe-art" aria-hidden="true"></div><div><h4>${escapeHtml(post.title||`风味灵感 ${index+1}`)}</h4><p>${escapeHtml(recipe)}</p><div class="recipe-stats"><span><b>${escapeHtml(heat)}</b> 热度</span><span>${escapeHtml(copies)} 复刻</span><span>${escapeHtml(likes)} 喜欢</span></div></div></div>
          <div class="tag-row">${tags}</div>
          <div class="reply-block">${replies}</div>
        </div></article>`;
      }).join("");
    }
    async function loadPosts(){try{const data=await api("/api/community/posts");posts=data.posts||[];renderPosts();}catch(error){posts=[];renderPosts();}}
    $("#loginBtn").addEventListener("click",openLogin);$("#mobileLoginBtn").addEventListener("click",openLogin);$("#closeLogin").addEventListener("click",closeLogin);$("#loginModal").addEventListener("click",event=>{if(event.target.id==="loginModal")closeLogin();});$$(".auth-tab").forEach(tab=>tab.addEventListener("click",()=>setAuthMode(tab.dataset.authMode)));
    $("#authForm").addEventListener("submit",async event=>{event.preventDefault();try{let data;if(authMode==="register"){data=await api("/api/auth/register",{method:"POST",body:JSON.stringify({name:$("#registerName").value.trim(),password:$("#registerPass").value})});}else{data=await api("/api/auth/login",{method:"POST",body:JSON.stringify({name:$("#loginName").value.trim(),password:$("#loginPass").value})});}setCurrentUser(data.user,data.token);}catch(error){$("#authMessage").textContent=error.message;}});
    $("#logoutBtn").addEventListener("click",async()=>{try{await api("/api/auth/logout",{method:"POST"});}catch{}currentUser=null;authToken="";localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY);updateAuthUI();});
    $("#postForm").addEventListener("submit",async event=>{event.preventDefault();if(!currentUser){openLogin();return;}const title=$("#postTitle").value.trim();const body=$("#postBody").value.trim();const tags=$("#postTags").value.split(/[，,]/).map(tag=>tag.trim()).filter(Boolean);if(!title||!body)return;try{await api("/api/community/posts",{method:"POST",body:JSON.stringify({title,body,tags})});$("#postTitle").value="";$("#postBody").value="";$("#postTags").value="";await loadPosts();}catch(error){alert(error.message);}});
    updateAuthUI();loadPosts();
  </script>
</body>
</html>
